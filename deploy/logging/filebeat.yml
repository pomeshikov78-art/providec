# Filebeat: сбор JSON-логов контейнеров АИС «Техноконтур» → Logstash
filebeat.inputs:
  - type: container
    paths: ["/var/lib/docker/containers/*/*.log"]
    processors:
      - add_docker_metadata: ~
      - decode_json_fields:
          fields: ["message"]
          target: "tc"
          overwrite_keys: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
