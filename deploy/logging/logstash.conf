# Logstash: разбор структурированных логов ядра (JSON-формат приложения)
input {
  beats { port => 5044 }
}

filter {
  if [tc][src] {
    mutate {
      add_field => { "component" => "%{[tc][src]}" }
      add_field => { "level" => "%{[tc][lvl]}" }
    }
  }
  # события шины — отдельный индекс (аудит ИВП)
  if [tc][msg] =~ /ALERT/ {
    mutate { add_tag => ["bus_alert"] }
  }
  date { match => ["[tc][ts]", "yyyy-MM-dd HH:mm:ss,SSS"] target => "@timestamp" }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "technocontour-%{+YYYY.MM.dd}"
  }
  if "bus_alert" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "tc-alerts-%{+YYYY.MM.dd}" }
  }
}
