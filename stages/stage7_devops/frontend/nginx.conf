# nginx: статический клиент + API Gateway reverse-proxy + TLS (вариант А)
server {
    listen 80;
    server_name technocontour.local;

    # ФСТЭК: безопасные заголовки (дублируются бэкендом для /api)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: blob: https://unpkg.com https://tile.openstreetmap.org; frame-ancestors 'none'" always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        gzip on;
        gzip_types text/html application/javascript text/css;
    }

    # API Gateway → бэкенд (в K8s — сервис technocontour-backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 64m;          # импорт пакетов АССПР / файлы паспорта
    }
    location = /metrics {
        proxy_pass http://backend:8000;    # Prometheus scrape (доступ ограничен сетевой политикой)
    }
}

