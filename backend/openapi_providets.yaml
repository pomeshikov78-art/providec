components:
  schemas:
    AssprImport:
      properties:
        package:
          additionalProperties: true
          type: object
          title: Package
      type: object
      required:
      - package
      title: AssprImport
    ConcludeIn:
      properties:
        verdict:
          type: string
          title: Verdict
          default: Подтверждено
      type: object
      title: ConcludeIn
    DocCreate:
      properties:
        title:
          type: string
          title: Title
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
        kind:
          type: string
          title: Kind
          default: Справка
      type: object
      required:
      - title
      title: DocCreate
    EventIn:
      properties:
        type:
          type: string
          title: Type
        source:
          type: string
          title: Source
          default: external
        payload:
          type: string
          title: Payload
          default: ''
        sev:
          type: string
          title: Sev
          default: info
      type: object
      required:
      - type
      title: EventIn
    FieldUpdate:
      properties:
        updates:
          additionalProperties:
            type: string
          type: object
          title: Updates
      type: object
      required:
      - updates
      title: FieldUpdate
    GateDecision:
      properties:
        decision:
          type: string
          title: Decision
        comment:
          type: string
          title: Comment
          default: ''
      type: object
      required:
      - decision
      title: GateDecision
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        login:
          type: string
          title: Login
        password:
          type: string
          title: Password
        mfa_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Mfa Code
      type: object
      required:
      - login
      - password
      title: LoginRequest
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    StimCreate:
      properties:
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
        kind:
          type: string
          title: Kind
        title:
          type: string
          title: Title
        basis:
          type: string
          title: Basis
          default: ''
      type: object
      required:
      - kind
      - title
      title: StimCreate
    StimStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: StimStatus
    TelemetryIn:
      properties:
        value:
          type: number
          title: Value
      type: object
      required:
      - value
      title: TelemetryIn
    ToggleRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - enabled
      title: ToggleRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
